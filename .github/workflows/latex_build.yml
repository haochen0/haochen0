name: Build Research PDF
on: 
  push:
    branches:
      - main

jobs:
  build_latex:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile LaTeX Document
        uses: xu-cheng/latex-action@v3
        with:
          # Match the new filename here
          root_file: Macro_Structural_Dynamics_2026.tex

      - name: Rename PDF for Clarity
        run: mv Macro_Structural_Dynamics_2026.pdf Alabama_Trap_Analysis_2026.pdf

      - name: Deploy PDF to Research Folder
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: . 
          branch: gh-pages
          # This organizes all future PDFs into one clean folder
          target-folder: research_assets
