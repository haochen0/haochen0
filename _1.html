<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorized Access Only</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #007bff;
            --bg: #050505;
            --card: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Subtle background animation */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 123, 255, 0.05) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
            z-index: -1;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .portal-card {
            background: var(--card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        h1 {
            font-weight: 600;
            font-size: 1.5rem;
            letter-spacing: 2px;
            margin-bottom: 30px;
            color: #ccc;
        }

        input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 12px;
            color: #fff;
            font-size: 1.2rem;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            font-family: monospace;
            letter-spacing: 4px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 15px rgba(0, 123, 255, 0.2);
        }

        .hint {
            font-size: 0.8rem;
            color: #666;
            margin-top: 20px;
            letter-spacing: 1px;
        }

        #secret-content {
            display: none;
            animation: fadeIn 1s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .secret-reveal {
            font-size: 1rem;
            color: var(--primary);
            line-height: 1.6;
            margin-top: 20px;
        }

        .error-shake {
            animation: shake 0.4s ease;
            border-color: #ff4757 !important;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }
    </style>
</head>

<body>

    <div class="portal-card" id="gatekeeper">
        <h1>ACCESS GATE</h1>
        <input type="password" id="access-code" placeholder="000000" maxlength="6">
        <p class="hint">T-CODE [MMDD+99] REQUIRED</p>
    </div>

    <div class="portal-card" id="secret-content">
        <h1>AUTHORIZED</h1>
        <div class="secret-reveal" id="payload">
            <!-- You can put your secret links or text here -->
            <p>Welcome to the inner sanctum.</p>
            <p style="color: #888; font-size: 0.9rem;">The gate will close when this tab is shut.</p>
            <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">
            <a href="index.html" style="color: var(--primary); text-decoration: none;">Return to Surface</a>
        </div>
    </div>

    <!-- Encryption & OTP Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/otpauth@9.2.2/dist/otpauth.umd.min.js"></script>

    <script>
        const gate = document.getElementById('gatekeeper');
        const content = document.getElementById('secret-content');
        const input = document.getElementById('access-code');
        const hintText = document.querySelector('.hint');

        let MASTER_PASS = "";
        let DECRYPTED_TOTP_SECRET = "";

        // TOTP secret encrypted with your Master Password
        // Ensure this is updated via the encryptor tool whenever the secret changes.
        const ENCRYPTED_VAULT_DATA = "U2FsdGVkX19aoIVSwPrXBG335TMkjn2qcxnGgtu7FRPxCt9/J4dC3CZqJy0wIiPh+3E=";

        // Initial State: Ask for Master Password
        window.onload = () => {
            MASTER_PASS = prompt("ENTER MASTER PASSWORD TO DECRYPT VAULT:");
            if (!MASTER_PASS) {
                document.body.innerHTML = "<h1 style='text-align:center;margin-top:20%'>ACCESS DENIED</h1>";
                return;
            }

            try {
                // Try to decrypt the TOTP secret using the password
                const bytes = CryptoJS.AES.decrypt(ENCRYPTED_VAULT_DATA, MASTER_PASS);
                DECRYPTED_TOTP_SECRET = bytes.toString(CryptoJS.enc.Utf8);

                if (!DECRYPTED_TOTP_SECRET) throw new Error("Wrong Password");

                // Success! Password is correct.
                initTOTP();
            } catch (e) {
                alert("INVALID MASTER PASSWORD. VAULT REMAINS LOCKED.");
                document.body.innerHTML = "<h1 style='text-align:center;margin-top:20%'>ENCRYPTION ERROR</h1>";
            }
        };

        function initTOTP() {
            const totp = new OTPAuth.TOTP({
                issuer: "Haochen0",
                label: "Portal",
                secret: DECRYPTED_TOTP_SECRET,
            });

            setInterval(() => {
                const now = Math.floor(Date.now() / 1000);
                const remaining = 30 - (now % 30);
                hintText.innerText = `SYNCED WITH AUTHENTICATOR [${remaining}s]`;
            }, 1000);

            input.addEventListener('input', (e) => {
                if (e.target.value.length === 6) {
                    if (totp.validate({ token: e.target.value, window: 1 }) !== null) {
                        revealVault();
                    } else {
                        input.classList.add('error-shake');
                        setTimeout(() => { input.classList.remove('error-shake'); input.value = ''; }, 400);
                    }
                }
            });
        }

        function revealVault() {
            gate.style.display = 'none';
            content.style.display = 'block';

            const payload = document.getElementById('payload');
            payload.innerHTML = `
                <div style="text-align:left; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px;">
                    <p style="border-bottom: 1px solid var(--border); padding-bottom:10px; margin-bottom:15px;">🔐 <strong>ENCRYPTED ARCHIVE</strong></p>
                    
                    <a href="javascript:void(0)" onclick="decryptFile('pdf_uploads/Prompt Engineering_v7.pdf.enc', 'Prompt Engineering_v7.pdf')" 
                       style="color:#007bff; display:block; margin: 12px 0; text-decoration:none;">🔓 Prompt Engineering v7</a>
                    
                    <a href="javascript:void(0)" onclick="decryptFile('pdf_uploads/Transformers for Machine Learning_A Deep Dive.pdf.enc', 'Transformers_Tutorial.pdf')" 
                       style="color:#007bff; display:block; margin: 12px 0; text-decoration:none;">🔓 Transformers Deep Dive</a>
                    
                    <a href="javascript:void(0)" onclick="decryptFile('pdf_uploads/塞思·卡拉曼 安全边际 中文版.pdf.enc', 'Margin_of_Safety_CN.pdf')" 
                       style="color:#007bff; display:block; margin: 12px 0; text-decoration:none;">🔓 Margin of Safety (CN)</a>

                    <a href="javascript:void(0)" onclick="decryptFile('pdf_uploads/Alabama_Trap_Analysis_2026.pdf.enc', 'Alabama_Trap_Analysis_2026.pdf')" 
                       style="color:#007bff; display:block; margin: 12px 0; text-decoration:none;">🔓 Alabama Trap Research (Full Report)</a>
                    
                    <p style="font-size: 0.7rem; color: #666; margin-top:20px;">[AES-256-DECRYPTION READY]</p>
                </div>
            `;
        }

        async function decryptFile(url, outputName) {
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = "⏳ DECRYPTING...";
            btn.style.pointerEvents = "none";

            try {
                // Fetch the encrypted .enc file (which is a base64 string)
                const response = await fetch(url);
                if (!response.ok) throw new Error("File not found on server");
                const encryptedData = await response.text();

                // Decrypt using our Master Password
                const decryptedBytes = CryptoJS.AES.decrypt(encryptedData, MASTER_PASS);
                const decryptedHex = decryptedBytes.toString(CryptoJS.enc.Hex);

                if (!decryptedHex) throw new Error("Decryption failed. Check password.");

                // Convert Hex to Byte Array for Blob
                const typedArray = new Uint8Array(decryptedHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
                const blob = new Blob([typedArray], { type: 'application/pdf' });

                // Trigger Download
                const link = document.createElement('a');
                link.href = window.URL.createObjectURL(blob);
                link.download = outputName;
                link.click();

                btn.innerText = "✅ DOWNLOADED";
            } catch (e) {
                alert("ERROR: " + e.message);
                btn.innerText = "❌ FAILED";
            } finally {
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.pointerEvents = "auto";
                }, 3000);
            }
        }
    </script>
</body>

</html>
